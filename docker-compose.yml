# Payment QA Runner — SQLite default shares ./data for backend+worker.
# Browser talks ONLY to frontend:3000/api/* (Same-Origin). Next proxies to backend:8000.
# Postgres profile: DATABASE_URL=postgresql+psycopg2://qa:qa@postgres:5432/payment_qa
#   docker compose --profile postgres up -d

networks:
  pqa:
    name: payment-qa-net
    driver: bridge

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/payment_qa.db}
      SCREENSHOT_DIR: /data/screenshots
      REPORT_DIR: /data/reports
      LOG_DIR: /data/logs
      SESSION_DIR: /data/sessions
      PLAYWRIGHT_MOCK: ${PLAYWRIGHT_MOCK:-0}
      LIVE_TESTING_ENABLED: ${LIVE_TESTING_ENABLED:-false}
      # Same-Origin deploy: CORS not required for browser→frontend→backend path.
      # Keep localhost for direct API debugging / local next dev.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./data:/data
      - ./docs:/app/docs:ro
    ports:
      - "8000:8000"
    networks:
      - pqa
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/payment_qa.db}
      PLAYWRIGHT_MOCK: ${PLAYWRIGHT_MOCK:-0}
      LIVE_TESTING_ENABLED: ${LIVE_TESTING_ENABLED:-false}
      SCREENSHOT_DIR: /data/screenshots
      REPORT_DIR: /data/reports
      LOG_DIR: /data/logs
      SESSION_DIR: /data/sessions
      WORKER_HEARTBEAT_FILE: /data/logs/worker.heartbeat
      # FIXTURE_BASE_URL unset → worker uses bundled file:// fixture
    volumes:
      - ./data:/data
    networks:
      - pqa
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/logs/worker.heartbeat && find /data/logs/worker.heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    # Nested/limited Docker DNS: also resolve backend via host-published port
    extra_hosts:
      - "backend:host-gateway"
    ports:
      - "3000:3000"
    networks:
      - pqa
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: payment_qa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pqa

volumes:
  pgdata:
