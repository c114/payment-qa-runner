# Payment Test Runner 2.0.0
# Browser → frontend:3000/api/* (Same-Origin) → backend:8000
# Services: frontend, backend, worker, sandbox
# Backend API bound to 127.0.0.1 only (local scripts). Web UI on :3000.

networks:
  pqa:
    name: payment-qa-net
    driver: bridge

services:
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    # 127.0.0.1 for host debug; 172.17.0.1 for worker/backend via sandbox:host-gateway
    # (this host's Docker bridge blocks container↔container TCP to sandbox)
    ports:
      - "127.0.0.1:8080:8080"
      - "172.17.0.1:8080:8080"
    networks:
      - pqa
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 8s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/payment_qa.db}
      SCREENSHOT_DIR: /data/screenshots
      REPORT_DIR: /data/reports
      LOG_DIR: /data/logs
      SESSION_DIR: /data/sessions
      TRACE_DIR: /data/traces
      WORKER_HEARTBEAT_FILE: /data/logs/worker.heartbeat
      SANDBOX_BASE_URL: http://sandbox:8080
      PROXY_TEST_URL: http://sandbox:8080/health
      APP_VERSION: "2.0.0"
      PLAYWRIGHT_MOCK: "0"
      LIVE_TESTING_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./data:/data
      - ./docs:/app/docs:ro
    ports:
      - "127.0.0.1:8000:8000"
    # Host bridge may block container→container TCP to sandbox:8080; remap via published 127.0.0.1:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "sandbox:host-gateway"
    networks:
      - pqa
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    # Same bridge workaround as backend — keep sandbox hostname, route via host-published 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "sandbox:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/payment_qa.db}
      SCREENSHOT_DIR: /data/screenshots
      REPORT_DIR: /data/reports
      LOG_DIR: /data/logs
      SESSION_DIR: /data/sessions
      TRACE_DIR: /data/traces
      WORKER_HEARTBEAT_FILE: /data/logs/worker.heartbeat
      SANDBOX_BASE_URL: http://sandbox:8080
      PROXY_TEST_URL: http://sandbox:8080/health
      APP_VERSION: "2.0.0"
      PLAYWRIGHT_MOCK: "0"
      LIVE_TESTING_ENABLED: "true"
    volumes:
      - ./data:/data
    networks:
      - pqa
    depends_on:
      backend:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/logs/worker.heartbeat && find /data/logs/worker.heartbeat -mmin -2 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "3000:3000"
    networks:
      - pqa
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
